@if (open()) {
  <div class="dialog-backdrop" role="presentation">
    <section class="dialog card" role="dialog" aria-modal="true" [attr.aria-label]="title()">
      <h2>{{ title() }}</h2>
      <p class="muted">{{ message() }}</p>
      <div class="actions">
        <button class="button button--danger" type="button" (click)="confirmed.emit()">Confirmar</button>
        <button class="button" type="button" (click)="cancelled.emit()">Cancelar</button>
      </div>
    </section>
  </div>
}
