<div class="public-shell">
  <div class="public-mark">
    <div class="fiap-wordmark" aria-label="FIAP Forms">FIAP <span>FORMS</span></div>
    @if (isAuthenticated()) {
      <button class="button button--ghost" type="button" (click)="back()">Voltar</button>
    }
  </div>

  <main class="page page--narrow">
    <section class="question-block">
      <p class="page-kicker">Obrigado</p>
      <h1 class="page-title">Resposta registrada</h1>
      <p class="page-intro">Sua participacao foi enviada para a sessao atual do prototipo FIAP Forms.</p>
    </section>
  </main>
</div>
