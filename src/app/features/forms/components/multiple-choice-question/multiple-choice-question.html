<section class="question-block">
  <span class="question-index">Pergunta {{ index() + 1 }}</span>
  <fieldset
    class="field"
    [attr.aria-describedby]="invalid() ? question().id + '-error' : null"
    [attr.aria-invalid]="invalid()"
  >
    <legend class="question-block__title">
      {{ question().title }}
      @if (question().required) {
        <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatoria</span>
      }
    </legend>
    <div class="choice-list">
      @for (option of question().options; track option.value) {
        <app-toggle
          [id]="optionId($index)"
          [label]="option.label"
          [checked]="checked(option.value)"
          [disabled]="disabled()"
          (checkedChange)="toggle(option.value, $event)"
          (touched)="touched.emit()"
        />
      }
    </div>
    @if (invalid()) {
      <span class="error" [id]="question().id + '-error'">{{
        errorMessage() || question().errorMessage || 'Escolha pelo menos uma alternativa.'
      }}</span>
    }
  </fieldset>
</section>
