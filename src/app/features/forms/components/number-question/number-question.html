<section class="question-block">
  <span class="question-index">Pergunta {{ index() + 1 }}</span>
  <div class="field">
    <label class="question-block__title" [for]="question().id">
      {{ question().title }}
      @if (question().required) {
        <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatoria</span>
      }
    </label>
    <input
      class="input"
      type="number"
      [id]="question().id"
      [value]="value() ?? ''"
      [disabled]="disabled()"
      [class.input--invalid]="invalid()"
      [attr.aria-invalid]="invalid()"
      [attr.aria-describedby]="invalid() ? question().id + '-error' : null"
      placeholder="0"
      (input)="onInput($event)"
      (blur)="touched.emit()"
    />
    @if (invalid()) {
      <span class="error" [id]="question().id + '-error'">Informe um numero para continuar.</span>
    }
  </div>
</section>
