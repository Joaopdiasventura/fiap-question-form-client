<section class="question-block">
  <span class="question-index">Pergunta {{ index() + 1 }}</span>
  <fieldset class="field">
    <legend class="question-block__title">
      {{ question().title }}
      @if (question().required) {
        <span class="required" aria-hidden="true">*</span><span class="sr-only">Obrigatoria</span>
      }
    </legend>
    <div class="choice-list">
      @for (option of question().options; track option) {
        <app-toggle
          controlType="radio"
          [id]="optionId($index)"
          [name]="groupName()"
          [label]="option"
          [checked]="value() === option"
          [disabled]="disabled()"
          (checkedChange)="choose(option, $event)"
          (touched)="touched.emit()"
        />
      }
    </div>
    @if (invalid()) {
      <span class="error" [id]="question().id + '-error'">Escolha uma alternativa para continuar.</span>
    }
  </fieldset>
</section>
